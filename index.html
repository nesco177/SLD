<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Substation SLD Simulator of S&D-4 Rajshahi</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-color: #0f172a;
            --primary-color: #2563eb;
            --energized-color: #e11d48;
            --deenergized-color: #0f172a;
            --status-on: #10b981;
            --status-off: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.collapsed {
            transform: translateX(-100%);
        }

        .sidebar-header {
            padding: 16px;
            background: #1e293b;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .sidebar-close-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .sidebar-close-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .toggle-sidebar-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toggle-sidebar-btn:hover {
            background: #334155;
        }

        .global-controls {
            padding: 12px 16px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn:hover {
            background: #e2e8f0;
        }

        .search-box {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .search-box input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            font-size: 0.85rem;
        }

        .controls-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
        }

        .control-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--status-off);
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--status-on);
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        #main-view {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            cursor: grab;
            width: 100vw;
            height: 100vh;
        }

        #main-view:active {
            cursor: grabbing;
        }

        #sld-svg {
            width: 100%;
            height: 100%;
        }

        .overlay-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .legend-color {
            width: 16px;
            height: 4px;
            border-radius: 2px;
        }

        .sld-line {
            stroke: var(--deenergized-color);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            transition: stroke 0.3s ease;
        }

        .sld-line.energized {
            stroke: var(--energized-color);
        }

        .terminal-arrow {
            fill: none;
            stroke: var(--deenergized-color);
            stroke-width: 2.5;
            transition: stroke 0.3s ease;
        }

        .terminal-arrow.energized {
            stroke: var(--energized-color);
        }

        .comp-interactive {
            cursor: pointer;
        }

        .comp-interactive:hover circle,
        .comp-interactive:hover rect {
            stroke-width: 2.5px;
            filter: drop-shadow(0 0 3px rgba(37, 99, 235, 0.5));
        }

        .status-indicator {
            transition: fill 0.3s ease;
        }

        .status-on { fill: var(--status-on) !important; }
        .status-off { fill: var(--status-off) !important; }

        @keyframes flowAnimation {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }

        .animated-flow {
            stroke: #ffffff;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
            fill: none;
            opacity: 0;
        }

        .energized + .animated-flow {
            opacity: 0.9;
            animation: flowAnimation 0.8s linear infinite;
        }

        .label-bg {
            fill: #ffffff;
            stroke: #cbd5e1;
            stroke-width: 1;
            rx: 3;
            ry: 3;
        }

        .label-text {
            font-size: 11px;
            font-weight: 700;
            fill: #0f172a;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .cp-text {
            font-size: 12px;
            font-weight: 800;
            fill: #2563eb;
            text-anchor: middle;
        }
    </style>
</head>

        function initApp() {
            renderControls();
            renderSLD();
            calculatePowerFlow();
            setupPanZoom();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function filterSwitches() {
            const query = document.getElementById('switch-search').value.toLowerCase();
            const items = document.querySelectorAll('.control-item');
            items.forEach(item => {
                const text = item.querySelector('.control-label').innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function toggleComponent(id, forcedState) {
            if (componentsData[id]) {
                componentsData[id].state = forcedState !== undefined ? forcedState : !componentsData[id].state;
                calculatePowerFlow();
            }
        }

        function toggleAll(state) {
            Object.keys(componentsData).forEach(id => {
                componentsData[id].state = state;
            });
            calculatePowerFlow();
        }

        function renderControls() {
            const container = document.getElementById('controls-container');
            container.innerHTML = '';
            
            Object.keys(componentsData).forEach(id => {
                const comp = componentsData[id];
                const div = document.createElement('div');
                div.className = 'control-item';
                div.innerHTML = `
                    <span class="control-label">${comp.name}</span>
                    <label class="switch">
                        <input type="checkbox" id="btn-${comp.id}" onchange="toggleComponent('${comp.id}', this.checked)">
                        <span class="slider"></span>
                    </label>
                `;
                container.appendChild(div);
            });
        }

        function renderSLD() {
            const linesLayer = document.getElementById('lines-layer');
            const compsLayer = document.getElementById('components-layer');

            connectionsData.forEach(conn => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', conn.path);
                path.setAttribute('class', 'sld-line');
                path.setAttribute('id', `line-${conn.id}`);
                
                const animPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                animPath.setAttribute('d', conn.path);
                animPath.setAttribute('class', 'animated-flow');

                g.appendChild(path);
                g.appendChild(animPath);
                linesLayer.appendChild(g);
            });

            Object.keys(componentsData).forEach(id => {
                const comp = componentsData[id];
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', 'comp-interactive');
                g.setAttribute('onclick', `toggleComponent('${comp.id}')`);

                const title = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                title.textContent = `${comp.name} (${comp.id})`;
                g.appendChild(title);

                const createLabelBox = (lbl, cx, cy) => {
                    const charCount = String(lbl).length;
                    const w = Math.max(20, charCount * 7 + 8);
                    const h = 16;
                    
                    const lx = cx + 18;
                    const ly = cy - 14;

                    return `
                        <rect x="${lx - w/2}" y="${ly - h/2}" width="${w}" height="${h}" class="label-bg"/>
                        <text x="${lx}" y="${ly}" class="label-text">${lbl}</text>
                    `;
                };

                if (comp.type === 'source') {
                    g.innerHTML += `
                        <rect x="${comp.x - 30}" y="${comp.y - 20}" width="60" height="40" fill="white" stroke="#0f172a" stroke-width="2" rx="4"/>
                        <text x="${comp.x}" y="${comp.y + 4}" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">${comp.id}</text>
                        <circle id="status-${comp.id}" cx="${comp.x + 20}" cy="${comp.y - 12}" r="4.5" class="status-indicator status-off"/>
                    `;
                } else if (comp.type === 'load_break' || comp.type === 'disconnector') {
                    g.innerHTML += `
                        <rect x="${comp.x - 13}" y="${comp.y - 13}" width="26" height="26" fill="white" stroke="#0f172a" stroke-width="2" rx="2"/>
                        <circle id="status-${comp.id}" cx="${comp.x}" cy="${comp.y}" r="4.5" class="status-indicator status-off"/>
                        ${createLabelBox(comp.id, comp.x, comp.y)}
                    `;
                } else if (comp.type === 'transformer') {
                    g.innerHTML += `
                        <circle cx="${comp.x}" cy="${comp.y}" r="13" fill="white" stroke="#0f172a" stroke-width="2"/>
                        <circle id="status-${comp.id}" cx="${comp.x}" cy="${comp.y}" r="4.5" class="status-indicator status-off"/>
                        ${createLabelBox(comp.id, comp.x, comp.y)}
                    `;
                }

                if (['17', '18', '19', '20', '43', '44', '45', '46', '51', '52', '53'].includes(id)) {
                    let arrowY = 835;
                    if (id === '51') arrowY = 400;
                    if (id === '52') arrowY = 350;
                    if (id === '53') arrowY = 440;

                    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    arrow.setAttribute('d', `M ${comp.x - 5} ${arrowY - 8} L ${comp.x} ${arrowY} L ${comp.x + 5} ${arrowY - 8}`);
                    arrow.setAttribute('class', 'terminal-arrow');
                    arrow.setAttribute('id', `arrow-out-${id}`);
                    compsLayer.appendChild(arrow);

                    if (['51', '52', '53'].includes(id)) {
                        const cpText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        cpText.setAttribute('x', comp.x);
                        cpText.setAttribute('y', arrowY + 16);
                        cpText.setAttribute('class', 'cp-text');
                        cpText.textContent = 'CP';
                        compsLayer.appendChild(cpText);
                    }
                }

                compsLayer.appendChild(g);
            });
        }

        function calculatePowerFlow() {
            const energizedNodes = new Set();
            const energizedEdges = new Set();
            const queue = [];

            ['G1', 'G2', 'S', 'T', 'H'].forEach(src => {
                if (componentsData[src] && componentsData[src].state) {
                    energizedNodes.add(src);
                    queue.push(src);
                }
            });

            while (queue.length > 0) {
                const curr = queue.shift();

                const canConduct = componentsData[curr] ? componentsData[curr].state : true;
                if (!canConduct) continue;

                connectionsData.forEach(conn => {
                    let neighbor = null;
                    if (conn.u === curr) neighbor = conn.v;
                    else if (conn.v === curr) neighbor = conn.u;

                    if (neighbor) {
                        energizedEdges.add(conn.id);
                        if (!energizedNodes.has(neighbor)) {
                            energizedNodes.add(neighbor);
                            queue.push(neighbor);
                        }
                    }
                });
            }

            updateVisuals(energizedNodes, energizedEdges);
        }

        function updateVisuals(energizedNodes, energizedEdges) {
            connectionsData.forEach(conn => {
                const line = document.getElementById(`line-${conn.id}`);
                const isLive = energizedEdges.has(conn.id);
                
                if (isLive) {
                    line.classList.add('energized');
                    if (line.getAttribute('marker-end') !== 'url(#arrow-red)') {
                        line.setAttribute('marker-end', 'url(#arrow-red)');
                    }
                } else {
                    line.classList.remove('energized');
                    line.removeAttribute('marker-end');
                }
            });

            Object.keys(componentsData).forEach(id => {
                const comp = componentsData[id];
                const indicator = document.getElementById(`status-${id}`);
                const checkbox = document.getElementById(`btn-${id}`);

                if (checkbox) checkbox.checked = comp.state;

                if (indicator) {
                    if (comp.state) {
                        indicator.classList.remove('status-off');
                        indicator.classList.add('status-on');
                    } else {
                        indicator.classList.remove('status-on');
                        indicator.classList.add('status-off');
                    }
                }

                const arrow = document.getElementById(`arrow-out-${id}`);
                if (arrow) {
                    if (comp.state && energizedNodes.has(id)) {
                        arrow.classList.add('energized');
                    } else {
                        arrow.classList.remove('energized');
                    }
                }
            });
        }

        let isPanning = false;
        let startX, startY;
        let viewBox = { x: 0, y: 0, w: 1600, h: 1150 };

        function setupPanZoom() {
            const svg = document.getElementById('sld-svg');
            
            svg.addEventListener('mousedown', (e) => {
                if (e.target.closest('.comp-interactive')) return;
                isPanning = true;
                startX = e.clientX;
                startY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isPanning) return;
                const dx = (e.clientX - startX) * (viewBox.w / svg.clientWidth);
                const dy = (e.clientY - startY) * (viewBox.h / svg.clientHeight);
                
                viewBox.x -= dx;
                viewBox.y -= dy;
                
                svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
                startX = e.clientX;
                startY = e.clientY;
            });

            window.addEventListener('mouseup', () => { isPanning = false; });

            svg.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1;
                
                const mx = e.clientX - svg.getBoundingClientRect().left;
                const my = e.clientY - svg.getBoundingClientRect().top;
                
                const svgMx = viewBox.x + (mx / svg.clientWidth) * viewBox.w;
                const svgMy = viewBox.y + (my / svg.clientHeight) * viewBox.h;

                viewBox.w *= zoomFactor;
                viewBox.h *= zoomFactor;
                
                viewBox.x = svgMx - (mx / svg.clientWidth) * viewBox.w;
                viewBox.y = svgMy - (my / svg.clientHeight) * viewBox.h;

                svg.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
            }, { passive: false });
        }

        function resetView() {
            viewBox = { x: 0, y: 0, w: 1600, h: 1150 };
            document.getElementById('sld-svg').setAttribute('viewBox', '0 0 1600 1150');
        }

        window.onload = initApp;
    </script>
